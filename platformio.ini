; Firmware layout (see README.md):
;   src/app/       portable engine / ui / gfx (no platform headers)
;   src/hal/       interfaces (Display, Touch, Backlight, Board)
;   src/drivers/   reusable drivers + panel init tables
;   src/platform/  per-SoC runtime (tasks, serial)
;   src/boards/    one folder per board: pins + driver choice
;
; New board = add src/boards/<name>/board.cpp + an env below.
;
;   pio run -t upload            -> default board
;   pio run -e hw_test -t upload -> old TFT_eSPI hardware test

[platformio]
default_envs = cyd2usb

[env]
; 6.x = Arduino core 2.0.x (ESP-IDF 4.4)
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 921600 drops bytes on the CYD's CH340, 460800 is reliable
upload_speed = 460800
board_build.partitions = min_spiffs.csv
build_unflags = -Os -std=gnu++11
build_flags = -O2 -std=gnu++17 -Isrc
; header-only and portable; used by the character config codec in app/
lib_deps =
	bblanchon/ArduinoJson@^7.2.0
; edited sprite sheets (art/*/sprites.json) are converted before building
extra_scripts = pre:tools/sprites/pio_hook.py

; Sources shared by every ESP32 board
[esp32]
src_filter = +<app/> +<drivers/common/> +<drivers/esp32/> +<platform/common/> +<platform/esp32/>

[env:cyd2usb]
board = esp32dev
build_src_filter = ${esp32.src_filter} +<boards/cyd2usb/>
; PERF_PROBE: per-core CPU load in serial stats (keeps idle task awake; dev only)
; WITH_HEROINE=0: no anime heroine, whose pictures (~440 KB) would fill the
; 1.9 MB app slot (two slots kept for OTA); cyd2usb_anime has her.
; WITH_CAPRI=0: no Capri either (~480 KB of pictures and voice clips)
build_flags = ${env.build_flags} -DPERF_PROBE=1 -DWITH_HEROINE=0 -DWITH_CAPRI=0

; The CYD with the anime heroine too, when wanted: nearly fills its app slot
[env:cyd2usb_anime]
extends = env:cyd2usb
build_flags = ${env.build_flags} -DPERF_PROBE=1 -DWITH_HEROINE=1 -DWITH_CAPRI=0

; Guition JC3248W535: ESP32-S3, 16 MB flash, 8 MB octal PSRAM, native USB (COM4 here)
[env:jc3248w535]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${esp32.src_filter} +<drivers/esp32s3/> +<boards/jc3248w535/>
; Serial on the chip's USB-Serial/JTAG port instead of UART0
build_flags = ${env.build_flags} -DPERF_PROBE=1 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

; Spotpear ESP32-S3 AI 1.54 "muma" (sold as a DeepSeek Box): ESP32-S3, 16 MB flash,
; 8 MB octal PSRAM, native USB (COM5 here), 240x240 ST7789 + CST816D touch
[env:muma]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${esp32.src_filter} +<boards/muma/>
build_flags = ${env.build_flags} -DPERF_PROBE=1 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

; SpotPear ESP32-S3-LCD-1.3 (prism "mini TV"): ESP32-S3R8, 16 MB flash, 8 MB octal
; PSRAM, 240x240 ST7789, no touch; serial on its CH343 (COM6 here), so UART0
[env:s3lcd13]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${esp32.src_filter} +<boards/s3lcd13/>
build_flags = ${env.build_flags} -DPERF_PROBE=1 -DBOARD_HAS_PSRAM

; The S3 boards again with the Arduino core built as an ESP-IDF component on our own IDF options
; (sdkconfig.defaults): the TLS buffers (~46 KB) go to PSRAM. For releases and RAM experiments;
; the first build compiles the IDF libraries (about 5 minutes), features are checked on the
; plain environments above. docs/ARCHITECTURE 11.2a has the numbers.
;   - this platform version has no custom_sdkconfig, the options are in sdkconfig.defaults
;   - build_src_filter does not apply to IDF builds: src/CMakeLists.txt picks the sources by the
;     board name, which comes from board_build.cmake_extra_args
;   - IDF looks for the partition table in the project: the same one as the Arduino core's
[idf_tls]
framework = arduino, espidf
board_build.partitions = tools/partitions/default_16MB.csv

[env:jc3248w535_tls]
extends = env:jc3248w535, idf_tls
board_build.cmake_extra_args = -DBOARD=jc3248w535

[env:muma_tls]
extends = env:muma, idf_tls
board_build.cmake_extra_args = -DBOARD=muma

[env:s3lcd13_tls]
extends = env:s3lcd13, idf_tls
board_build.cmake_extra_args = -DBOARD=s3lcd13

; Deterministic replay of the app without a display: screen hashes over serial,
; to compare two builds frame by frame (src/tools/replay/main.cpp). Without Capri,
; so that the character set is the one the slime tag was recorded with
[env:replay]
board = esp32dev
build_src_filter = +<app/> +<tools/replay/>
build_flags = ${env.build_flags} -DWITH_CAPRI=0

; The same replay on an ESP32-S3 board (output on its USB port): compare two
; builds on one chip, not across chips
[env:replay_s3]
board = esp32-s3-devkitc-1
build_src_filter = +<app/> +<tools/replay/>
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DWITH_CAPRI=0

; The same on an ESP32-S3 board whose USB goes through a USB-UART bridge to
; UART0 (e.g. the SpotPear ESP32-S3-LCD-1.3): output there instead
[env:replay_s3_uart]
board = esp32-s3-devkitc-1
build_src_filter = +<app/> +<tools/replay/>
build_flags = ${env.build_flags} -DWITH_CAPRI=0

; Previous starter firmware (TFT_eSPI based), kept for quick hardware checks
[env:hw_test]
board = esp32dev
build_src_filter = +<tools/hw_test/>
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
	${env.build_flags}
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DSMOOTH_FONT
	-DILI9341_2_DRIVER
	-DTFT_INVERSION_ON
