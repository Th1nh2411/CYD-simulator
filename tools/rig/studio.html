<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Studio</title>
<style>
:root { --bg:#0f1220; --panel:#181d30; --card:#1f2540; --line:#2a3150; --text:#e6e9f5; --dim:#8b93b5; --accent:#4aa3ff;
        --warn:#ffb340; --bad:#ff5c6c; --good:#5fd38d; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
       font: 13px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px;
         border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0 6px 0 0; }
h3 { margin: 0 0 6px; font-size: 15px; }
h4 { margin: 12px 0 4px; font-size: 13px; color: var(--dim); font-weight: 600; }
p { margin: 4px 0 8px; }
button, select, input { font: inherit; color: var(--text); background: #232a45; border: 1px solid var(--line);
                        border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
input[type=number] { width: 66px; }
input[type=text] { width: 116px; }
input[type=color] { width: 30px; height: 24px; padding: 1px; }
a { color: var(--accent); }
#status { color: var(--dim); margin-left: auto; }
#status.dirty { color: var(--warn); }
main { flex: 1; display: flex; min-height: 0; }
main[hidden] { display: none; }
#editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line);
           flex-wrap: wrap; }
#info { color: var(--dim); margin-left: auto; }
#view { flex: 1; min-height: 0; overflow: auto; position: relative;
        background: repeating-conic-gradient(#1b2036 0 25%, #151a2c 0 50%) 0 0 / 16px 16px; }
#canvas { display: block; touch-action: none; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim);
         padding: 20px; text-align: center; }
aside { width: 420px; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
        background: var(--panel); }
#steps { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
#steps button { padding: 3px 8px; border-radius: 14px; color: var(--dim); background: none; }
#steps button.on { color: #06101f; background: var(--accent); border-color: var(--accent); font-weight: 600; }
#steps button .mark { margin-left: 3px; color: var(--good); }
#steps button.on .mark { color: #06101f; }
#steps button .mark.todo { color: var(--warn); }
.pane { padding: 12px 14px; overflow: auto; flex: 1; }
.next { margin-top: 12px; display: flex; justify-content: flex-end; gap: 6px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
ul.check { margin: 4px 0; padding-left: 18px; }
ul.check li { margin: 2px 0; }
.legend { list-style: none; padding: 0; margin: 6px 0; }
.legend li { margin: 4px 0; display: flex; gap: 8px; }
.legend .mk { flex: 0 0 18px; text-align: center; font-weight: 700; }
.row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.row > .k { width: 104px; color: var(--dim); }
.hint { color: var(--dim); font-size: 12px; }
.warn { color: var(--warn); }
.ok { color: var(--good); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.pair { display: flex; gap: 10px; align-items: flex-start; }
.pair img { width: 110px; border-radius: 6px; background: #0b0e1a; flex: 0 0 auto; }
.drop { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; color: var(--dim);
        cursor: pointer; margin: 8px 0; }
.drop.over, .slot.over { border-color: var(--accent); color: var(--text); }
img.thumb { max-width: 100%; max-height: 200px; border-radius: 6px; background: #0b0e1a; display: block; margin-top: 6px; }
.slot { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0; }
.slot .title { display: flex; gap: 6px; align-items: baseline; }
.slot .title b { font-size: 14px; }
.slot .pics { display: flex; gap: 8px; margin-top: 6px; }
.slot figure { margin: 0; width: 88px; text-align: center; font-size: 11px; color: var(--dim); }
.slot figure img, .slot figure .none { width: 88px; height: 88px; object-fit: contain; border-radius: 6px;
                                        background: #0b0e1a; display: block; }
.slot figure .none { border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center;
                     cursor: pointer; color: var(--dim); }
.ask { font-size: 12px; color: var(--dim); }
.ask button { padding: 0 6px; font-size: 11px; margin-left: 4px; }
#pv { position: relative; background: repeating-conic-gradient(#1b2036 0 25%, #151a2c 0 50%) 0 0 / 16px 16px;
      border-radius: 6px; overflow: hidden; margin-top: 6px; }
#pv canvas { width: 100%; image-rendering: pixelated; display: block; }
#pvMsg { color: var(--dim); padding: 30px 10px; text-align: center; }
pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, Consolas, monospace; background: #0b0e1a; padding: 8px;
      border-radius: 6px; margin: 6px 0 0; max-height: 50vh; overflow: auto; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 6px 10px 8px; }
legend { color: var(--dim); padding: 0 4px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 3px 2px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td input[type=text] { width: 96px; }
.regions label { margin-right: 4px; color: var(--dim); white-space: nowrap; }
#spritePane { flex: 1; overflow: auto; padding: 14px 18px; }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 10px 0; }
.sheet canvas { image-rendering: pixelated; display: block; margin: 8px 0; max-width: 100%;
                background: repeating-conic-gradient(#2a3150 0 25%, #1f2540 0 50%) 0 0 / 12px 12px; }
.palette { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--dim); }
#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px;
         display: none; max-width: 86vw; z-index: 9; border: 1px solid var(--bad); background: #3a1220; white-space: pre-wrap; }
#toast.ok { border-color: var(--good); background: #12321f; }
@media (max-width: 900px) {
  main#rigMode { flex-direction: column; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); height: 55vh; }
}
</style>
</head>
<body>
<header>
  <h1>Rig Studio</h1>
  <select id="sets" title="art/ 아래 그림 세트"></select>
  <button id="newSet">새 2D 캐릭터</button>
  <span id="status"></span>
  <button id="save" class="primary" title="rig.json에 저장 (Ctrl+S)">저장</button>
</header>
<main id="rigMode">
  <section id="editor">
    <div class="toolbar">
      <button id="zoomOut" title="축소">−</button><button id="zoomFit">맞춤</button><button id="zoomIn" title="확대">+</button>
      <select id="imgKind"><option value="cut">누끼</option><option value="source">원본</option></select>
      <span id="info"></span>
    </div>
    <div id="view"><canvas id="canvas"></canvas><div id="empty">1단계에서 원본 그림을 올리면 여기에 나옵니다.</div></div>
  </section>
  <aside>
    <nav id="steps"></nav>
    <div class="pane" id="stepPane"></div>
  </aside>
</main>
<main id="spriteMode" hidden><div id="spritePane"></div></main>
<div id="toast"></div>
<input type="file" id="filePick" hidden>
<script>
"use strict";
const $ = id => document.getElementById(id);
const S = {
  sets: [], example: "heroine", slots: [], kind: null, name: null, rig: null, files: null, img: null, zoom: 0,
  dirty: false, undo: [], drag: null, hover: null, step: 1, follow: null, showFollow: false, pv: {}, level: 0,
  playing: false, playAt: 0, job: null,
};
const SHAPE = {
  eyes: { label: "눈", color: "#3fd6ff", size: [56, 26] },
  brows: { label: "눈썹", color: "#b48cff", size: [52, 22] },
  mouth: { label: "입", color: "#ff7fb0", size: [40, 24] },
};
const STEPS = [
  { id: 1, label: "그림" }, { id: 2, label: "누끼" }, { id: 3, label: "고개" }, { id: 4, label: "얼굴" },
  { id: 5, label: "표정" }, { id: 6, label: "변환" }, { id: 7, label: "고급" },
];

// ---- server ----
async function api(method, path, body) {
  const opts = { method };
  if (body !== undefined) opts.body = body instanceof Blob || typeof body === "string" ? body : JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
let toastTimer = 0;
function toast(msg, ok) {
  const t = $("toast");
  t.textContent = msg;
  t.className = ok ? "ok" : "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), ok ? 2500 : 7000);
}
const fileUrl = (set, path, info) => `/file?set=${set}&path=${encodeURIComponent(path)}&v=${info ? info.mtime : 0}`;
const thumbUrl = (set, path, info, w, face) =>
  `/thumb?set=${set}&path=${encodeURIComponent(path)}&w=${w}${face ? "&face=1" : ""}&v=${info ? info.mtime : 0}`;

// ---- small DOM helpers ----
let binds = [];
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
}
function fill(node, ...kids) { node.replaceChildren(...kids.filter(k => k !== null && k !== undefined && k !== false)); }
function syncInputs() {
  for (const b of binds) if (document.activeElement !== b.el && b.el.isConnected) b.el.value = b.get();
}
function num(get, set, opt = {}) {
  const input = el("input", { type: "number", step: opt.step || 1, min: opt.min, title: opt.title });
  input.value = get();
  input.addEventListener("focus", snapshot);
  input.addEventListener("input", () => {
    const v = opt.step && opt.step < 1 ? parseFloat(input.value) : parseInt(input.value, 10);
    if (Number.isNaN(v)) return;
    set(v);
    changed(true);
  });
  binds.push({ el: input, get });
  return input;
}
function row(label, ...kids) { return el("div", { class: "row" }, el("span", { class: "k" }, label), ...kids); }
function sw(color) { return el("span", { class: "sw", style: `background:${color}` }); }
function pickFile(accept, onFile) {
  const input = $("filePick");
  input.accept = accept;
  input.value = "";
  input.onchange = () => input.files[0] && onFile(input.files[0]);
  input.click();
}
function dropTarget(node, accept, onFile) {
  node.addEventListener("dragover", e => { e.preventDefault(); node.classList.add("over"); });
  node.addEventListener("dragleave", () => node.classList.remove("over"));
  node.addEventListener("drop", e => {
    e.preventDefault(); node.classList.remove("over");
    if (e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
  });
  return node;
}
function dropZone(text, onFile) {
  const d = el("div", { class: "drop" }, text);
  d.onclick = () => pickFile(".png,.jpg,.jpeg,.webp", onFile);
  return dropTarget(d, null, onFile);
}
function copyButton(text) {
  return el("button", { title: "복사", onclick: async () => {
    try { await navigator.clipboard.writeText(text); toast("복사했습니다.", true); } catch { toast(text, true); }
  } }, "복사");
}

// ---- geometry: the head rig is in device px, the picture and the face in source px ----
const P = () => S.rig.portrait;
const T = () => S.rig.portrait.tilt;
const scale = () => P().height / Math.max(1, P().crop[1] - P().crop[0]);
const devToY = d => P().crop[0] + d / scale();
const devToX = d => d / scale();
const yToDev = y => Math.round((y - P().crop[0]) * scale());
const xToDev = x => Math.round(x * scale());

// Crop and height change the scale; the rig stays where it is on the picture
function keepingPlace(change) {
  const t = T(), p = P();
  const at = { pivot: [devToX(t.pivot[0]), devToY(t.pivot[1])], neck: t.neck.map(devToY), hair: t.hair.map(devToY),
               chest: devToY(p.chest) };
  change();
  t.pivot = [xToDev(at.pivot[0]), yToDev(at.pivot[1])];
  t.neck = at.neck.map(yToDev);
  t.hair = at.hair.map(yToDev);
  p.chest = yToDev(at.chest);
}

// A new character starts with the heroine's proportions on its picture
function startGeometry(w, h) {
  const k = w / 1024, p = P(), t = T(), f = S.rig.face;
  p.crop = [0, Math.min(h, Math.round(760 * k))];
  t.pivot = [xToDev(w / 2), 182];
  t.neck = [150, 182];
  t.hair = [175, 205];
  p.chest = 172;
  const sc = v => Math.round(v * k);
  f.window = [380, 225, 680, 445].map(sc);
  f.shapes = { eyes: [[451, 308, 56, 26], [595, 294, 56, 26]].map(e => e.map(sc)),
               brows: [[455, 262, 52, 22], [577, 247, 52, 22]].map(e => e.map(sc)), mouth: [[532, 386, 40, 24].map(sc)] };
  changed(true);
  fitZoom();
}

// ---- state ----
function snapshot() {
  S.undo.push(JSON.stringify(S.rig));
  if (S.undo.length > 100) S.undo.shift();
}
function changed(final) {
  S.dirty = true;
  status();
  syncInputs();
  draw();
  if (final) { S.pv = {}; schedulePreview(); scheduleRoom(); }
}
function status() {
  const s = $("status");
  if (S.kind !== "rig") { s.textContent = ""; $("save").hidden = true; return; }
  $("save").hidden = false;
  s.textContent = S.dirty ? "저장 안 됨" : "저장됨";
  s.className = S.dirty ? "dirty" : "";
}
window.addEventListener("beforeunload", e => { if (S.dirty) e.preventDefault(); });

async function loadSets(pick) {
  const r = await api("GET", "/api/sets");
  S.sets = r.sets; S.example = r.example; S.exampleSource = r.exampleSource;
  const sel = $("sets");
  const group = (label, kind) => el("optgroup", { label },
    ...S.sets.filter(s => s.kind === kind).map(s => el("option", { value: s.name }, s.name)));
  fill(sel, group("2D 캐릭터 (그림 + 리깅)", "rig"), group("도트 스프라이트", "sprites"));
  const names = S.sets.map(s => s.name);
  const want = pick || localStorage.getItem("rigStudioSet");
  if (names.length) await loadSet(names.includes(want) ? want : names[0]);
}
async function loadSet(name) {
  if (S.dirty && !confirm("저장하지 않은 리깅이 있습니다. 버리고 바꿀까요?")) { $("sets").value = S.name; return; }
  const kind = S.sets.find(s => s.name === name).kind;
  stopPlay();
  S.kind = kind; S.name = name; S.dirty = false; S.undo = []; S.pv = {}; S.follow = null;
  $("sets").value = name;
  localStorage.setItem("rigStudioSet", name);
  $("rigMode").hidden = kind !== "rig";
  $("spriteMode").hidden = kind !== "sprites";
  if (kind === "sprites") { status(); return showSprites(await api("GET", `/api/sprites?name=${name}`)); }
  const st = await api("GET", `/api/set?name=${name}`);
  S.rig = st.rig; S.files = st.files; S.img = null;
  status();
  loadImage(true);
  const saved = parseInt(localStorage.getItem(`rigStudioStep:${name}`), 10);
  showStep(saved || (S.files.source ? 3 : 1));
}
function adoptFiles(st) {  // after an upload or a step: new files, the rig being edited stays
  S.files = st.files;
  if (st.rig.source !== S.rig.source) S.rig.source = st.rig.source;
  loadImage(false);
  buildSteps();
  showStep(S.step, true);
}
function loadImage(fit) {
  const f = S.files;
  const useCut = $("imgKind").value === "cut" && f.cut;
  const src = useCut ? fileUrl(S.name, "base_cut.png", f.cut) : f.source ? fileUrl(S.name, S.rig.source, f.source) : null;
  $("empty").style.display = src ? "none" : "flex";
  if (!src) { S.img = null; draw(); return; }
  const img = new Image();
  img.onload = () => {
    const first = !S.img;
    S.img = img;
    if (fit || first || !S.zoom) fitZoom();
    if (P().crop[1] === 0) {
      startGeometry(img.naturalWidth, img.naturalHeight);
      toast("리깅을 기본 비율로 놓았습니다. 3·4단계에서 그림에 맞게 옮기세요.", true);
    }
    draw();
  };
  img.src = src;
}

// ---- steps ----
function stepMark(id) {
  const f = S.files;
  if (id === 1) return f.source ? "✓" : "!";
  if (id === 2) return f.cut ? "✓" : "!";
  if (id === 5) {
    const all = Object.values(S.rig.frames), have = all.filter(fr => (f.edits[fr.edit] || {}).src).length;
    return `${have}/${all.length}`;
  }
  return "";
}
function buildSteps() {
  fill($("steps"), ...STEPS.map(s => {
    const mark = stepMark(s.id);
    return el("button", { class: S.step === s.id ? "on" : "", onclick: () => showStep(s.id) },
      s.id < 7 ? `${s.id} ${s.label}` : s.label,
      mark ? el("span", { class: "mark" + (mark === "!" || /^(\d+)\/(?!\1$)/.test(mark) ? " todo" : "") }, mark) : null);
  }));
}
function showStep(id, keepScroll) {
  const pane = $("stepPane"), top = pane.scrollTop;
  S.step = id;
  localStorage.setItem(`rigStudioStep:${S.name}`, id);
  binds = [];
  if (id !== 3) stopPlay();
  buildSteps();
  const build = [null, step1, step2, step3, step4, step5, step6, stepAdvanced][id];
  fill(pane, ...build());
  pane.scrollTop = keepScroll ? top : 0;
  draw();
  paintJob();
  if (id === 3) startPlay();
  if (id === 7) scheduleRoom();
}
function nextButton(to, label) {
  return el("div", { class: "next" }, el("button", { class: "primary", onclick: () => showStep(to) }, label));
}

function step1() {
  const f = S.files, ex = S.example;
  const exSrc = S.exampleSource ? el("img", { src: thumbUrl(ex, S.exampleSource, null, 220), alt: "" }) : null;
  const prompt = "정면을 보는 캐릭터 한 명의 상반신, 머리 끝부터 허리까지, 초록 단색 배경(#00FF00), 세로 2:3, 눈 뜨고 입 다문 기본 표정";
  let mine = null;
  if (f.source) {
    const [w, h] = f.source.size, warns = [];
    if (w < 800) warns.push(`가로 ${w} px로 작습니다. 1000 px 이상이면 더 선명합니다.`);
    if (w >= h) warns.push("가로로 긴 그림입니다. 세로 그림(상반신)이 맞습니다.");
    mine = el("div", { class: "box" }, el("b", {}, "올린 그림"),
      el("div", { class: "pair" }, el("img", { src: thumbUrl(S.name, S.rig.source, f.source, 220), alt: "" }),
        el("div", {}, el("div", {}, `${S.rig.source}, ${w}×${h}`),
          ...(warns.length ? warns.map(t => el("div", { class: "warn" }, t)) : [el("div", { class: "ok" }, "크기와 방향은 괜찮습니다.")]))));
  }
  return [
    el("h3", {}, "1. 원본 그림"),
    el("p", {}, "캐릭터 한 명을 그린 기본 그림 한 장이 필요합니다. 기기에서는 이 그림을 줄여서 보여 주고, 고개를 갸웃하는 자세도 이 그림을 구부려서 만듭니다."),
    el("div", { class: "box" }, el("b", {}, "이런 그림을 넣으세요"),
      el("div", { class: "pair" }, exSrc,
        el("ul", { class: "check" },
          el("li", {}, "정면을 보는 한 명, 세로 그림 (가로:세로 약 2:3)"),
          el("li", {}, "머리 끝부터 가슴 아래까지 다 보이게 (허리나 전신까지 있어도 됨)"),
          el("li", {}, "눈 뜨고 입 다문 기본 표정, 머리카락이 눈과 입을 가리지 않게"),
          el("li", {}, "배경은 한 가지 색. 초록(#00FF00)이 가장 깨끗하게 지워집니다 (흰색, 단색, 체크무늬도 됨)"),
          el("li", {}, "가로 1000 px 이상, PNG·JPG·WebP"))),
      exSrc ? el("div", { class: "hint" }, `왼쪽은 예시 (${ex}). `) : null,
      el("div", { class: "ask" }, "이미지 모델에 부탁할 때: ", el("i", {}, prompt), copyButton(prompt))),

// ---- uploads and steps on the server ----
async function uploadImage(kind, file, edit) {
  try {
    const q = `set=${S.name}&kind=${kind}&filename=${encodeURIComponent(file.name)}` + (edit ? `&edit=${edit}` : "");
    const st = await api("POST", `/api/upload?${q}`, file);
    adoptFiles(st);
    toast(kind === "source" ? "원본을 올렸습니다. 다음은 2단계 누끼입니다." : `${edit} 그림을 올렸습니다.`, true);
  } catch (e) { toast(e.message); }
}
async function save(quiet) {
  try {
    const r = await api("POST", `/api/save?set=${S.name}`, S.rig);
    S.dirty = false;
    status();
    adoptFiles(r);
    if (!quiet) toast(r.changed ? "rig.json에 저장했습니다." : "바뀐 것이 없습니다.", true);
    return true;
  } catch (e) { toast(e.message); return false; }
}
async function run(what) {
  if (S.dirty && !(await save(true))) return;
  try {
    S.job = await api("POST", `/api/run?set=${S.name}&what=${what}`);
    showStep(S.step, true);
    pollJob();
  } catch (e) { toast(e.message); }
}
function jobBox() {
  return el("div", { id: "jobBox" });
}
function paintJob() {
  const box = $("jobBox"), j = S.job;

function sheetCard(name, st, sheet, about, strip) {

      el("ul", { class: "check" },
        el("li", {}, "크기는 그대로: 칸 크기 × 칸 수. 2배, 3배처럼 정수배로 키운 그림도 됩니다."),
        el("li", {}, "색은 그 시트 아래 팔레트 견본 색만 씁니다. 견본 색은 '자리'를 뜻하고, 실제 화면 색은 기기 설정(몸·배·목도리 색 등)에서 정해집니다. 비슷한 색은 가장 가까운 자리로 들어가고, 너무 다른 색은 위치와 함께 알려 주며 시트를 되돌립니다."),
        el("li", {}, "빈 곳은 투명으로 둡니다."),
        el("li", {}, "칸의 순서와 이름(그림 위 글자)은 펌웨어가 쓰는 것이라 그대로 둡니다."))),
    el("h3", { style: "margin-top:18px" }, "공통 시트 (모든 몬스터가 같이 씀)"),
    ...st.shared.map(sheet => sheetCard(name, st, sheet, sheet.about)),
  ];
  if (block) {
    const others = block.list.map(c => el("option", { value: c.id }, `${c.label} · ${c.defaults.name}`));
    const nid = el("input", { type: "text", placeholder: "예: thunder", style: "width:110px" });
    const nlabel = el("input", { type: "text", placeholder: "예: 번개", style: "width:80px" });
    const nname = el("input", { type: "text", placeholder: "예: 찌릿", style: "width:80px" });
    const from = el("select", {}, ...others);
    const blank = el("input", { type: "radio", name: "startWith", checked: true });
    const copy = el("input", { type: "radio", name: "startWith" });
    parts.push(
      el("h3", { style: "margin-top:18px" }, "몬스터마다 필요한 것"),
      el("div", { class: "box" },
        el("p", {}, block.about),
        el("ul", { class: "check" }, ...block.sheets.map(s => el("li", {}, `${s.png.replace("{id}", "<id>")}: ${s.about}`))),
        el("b", {}, "칸마다 그릴 것"),
        el("table", {}, el("tbody", {}, ...Object.entries(block.roles).map(([r, what]) =>
          el("tr", {}, el("td", { style: "width:70px" }, el("b", {}, r)), el("td", {}, what))))),
        el("p", { class: "hint" }, "그리고 정보: 이름표, 기본 이름, 프리셋 이름, 기술 모양, 특징(강조색) 이름 두 개, 기본 색 다섯 개.")),
      ...block.list.map(ch => characterCard(name, st, ch)),
      el("div", { class: "box" }, el("b", {}, "+ 몬스터 추가"),
        el("p", { class: "hint" }, "시트 두 장이 칸 배치 그대로 만들어집니다. 내려받아 그려서 올리고, 카드에서 정보(기본 색, 기술 모양 ...)를 고치세요. 펌웨어 코드는 고치지 않아도 됩니다: 다음 빌드부터 설정의 스타팅 고르기에 나옵니다."),
        row("id (영문)", nid), row("이름표", nlabel), row("기본 이름", nname),
        row("시트", el("label", {}, blank, " 빈 시트 (투명, 처음부터 그리기)"), el("label", {}, copy, " 아래 몬스터의 그림 복사 (고쳐 그리기)")),
        row("팔레트·정보", from, el("span", { class: "hint" }, "팔레트(견본 색)와 기술 모양·기본 색·특징 이름을 이 몬스터에서 가져옴")),
        el("p", { class: "hint" }, "빈 시트는 그리기 전까지 기기에서 투명하게(안 보이게) 나옵니다. 편집기에서 격자를 칸 크기(16×16, 뒷모습 32×32)로 맞추고, 아래 '팔레트 내려받기'로 받은 견본 색으로 그리면 됩니다."),
        el("div", { class: "next" }, el("button", { class: "primary", onclick: async () => {
          try {
            const r = await api("POST", `/api/sprites/add?set=${name}`,
              { id: nid.value.trim(), label: nlabel.value.trim(), name: nname.value.trim(), from: from.value, blank: blank.checked });
            showSprites(r);
            const card = $(`char-${nid.value.trim()}`);
            if (card) card.scrollIntoView({ behavior: "smooth" });
            toast(blank.checked ? "추가했습니다. 빈 시트를 내려받아 그려서 올리세요." : "추가했습니다. 복사한 시트를 내려받아 고쳐 그려 올리세요.", true);
          } catch (e) { toast(e.message); }
        } }, "추가"))));
  }
  fill($("spritePane"), ...parts);
}
async function uploadSheet(name, sheet, file) {
  try {
    const st = await api("POST", `/api/upload?set=${name}&kind=sheet&sheet=${encodeURIComponent(sheet)}`, file);
    toast(st.message, true);
    showSprites(st);
  } catch (e) { toast(e.message); }
}
async function saveCharacter(name, draft) {
  try {
    const { label, preset, move, accentNames, defaults } = draft;
    showSprites(await api("POST", `/api/sprites/character?set=${name}&id=${draft.id}`, { label, preset, move, accentNames, defaults }));
    toast("저장하고 다시 변환했습니다. 다음 빌드부터 들어갑니다.", true);
  } catch (e) { toast(e.message); }
}
async function removeCharacter(name, ch) {
  if (!confirm(`${ch.label} · ${ch.defaults.name} (${ch.id})를 빼고 시트 두 장을 지울까요? (git에 남아 있으면 되살릴 수 있습니다)`)) return;
  try {
    showSprites(await api("POST", `/api/sprites/remove?set=${name}&id=${ch.id}`));
    toast("뺐습니다.", true);
  } catch (e) { toast(e.message); }
}

// ---- header ----
$("save").onclick = () => save();
$("sets").onchange = e => loadSet(e.target.value);
$("newSet").onclick = async () => {
  const name = prompt("새 캐릭터 이름 (영문 소문자·숫자·_, art/<이름>/ 폴더가 됩니다)");
  if (!name) return;
  try {
    await api("POST", `/api/create?name=${encodeURIComponent(name)}`);
    S.dirty = false;
    localStorage.setItem(`rigStudioStep:${name}`, 1);
    await loadSets(name);
  } catch (e) { toast(e.message); }
};
document.addEventListener("keydown", e => {
  if (S.kind !== "rig") return;
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "z" && !/INPUT|SELECT/.test(document.activeElement.tagName)) {
    e.preventDefault();
    const prev = S.undo.pop();
    if (!prev) return;
    S.rig = JSON.parse(prev);
    showStep(S.step, true);
    changed(true);
  }
});

(async () => {
  try {
    S.slots = (await api("GET", "/api/slots")).slots;
    S.job = await api("GET", "/api/job");
    await loadSets();
    if (S.job.running) pollJob();
  } catch (e) { toast(e.message); }
})();
</script>
